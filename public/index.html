<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Exchange</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div class="loadingOverlay hidden">
        <span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="Loading-Fill--Streamline-Mingcute-Fill" height="16" width="16">
                <desc>
                Loading Fill Streamline Icon: https://streamlinehq.com
                </desc>
                <defs>
                <linearGradient id="a" x1="50%" x2="50%" y1="5.271%" y2="91.793%">
                    <stop offset="0%" stop-color="#000000"></stop>
                    <stop offset="100%" stop-color="#000000" stop-opacity=".55"></stop>
                </linearGradient>
                <linearGradient id="b" x1="50%" x2="50%" y1="15.24%" y2="87.15%">
                    <stop offset="0%" stop-color="#000000" stop-opacity="0"></stop>
                    <stop offset="100%" stop-color="#000000" stop-opacity=".55"></stop>
                </linearGradient>
                </defs>
                <g fill="none" fill-rule="nonzero">
                <path d="M24 0v24H0V0h24ZM12.593 23.258l-.011.002-.071.035-.02.004-.014-.004-.071-.035c-.01-.004-.019-.001-.024.005l-.004.01-.017.428.005.02.01.013.104.074.015.004.012-.004.104-.074.012-.016.004-.017-.017-.427c-.002-.01-.009-.017-.017-.018Zm.265-.113-.013.002-.185.093-.01.01-.003.011.018.43.005.012.008.007.201.093c.012.004.023 0 .029-.008l.004-.014-.034-.614c-.003-.012-.01-.02-.02-.022Zm-.715.002a.023.023 0 0 0-.027.006l-.006.014-.034.614c0 .012.007.02.017.024l.015-.002.201-.093.01-.008.004-.011.017-.43-.003-.012-.01-.01-.184-.092Z"></path>
                <path fill="url(#a)" d="M8.749.021a1.5 1.5 0 0 1 .497 2.958A7.502 7.502 0 0 0 3 10.375a7.5 7.5 0 0 0 7.5 7.5v3c-5.799 0-10.5-4.7-10.5-10.5C0 5.23 3.726.865 8.749.021Z" transform="translate(1.5 1.625)"></path>
                <path fill="url(#b)" d="M15.392 2.673a1.5 1.5 0 0 1 2.119-.115A10.475 10.475 0 0 1 21 10.375c0 5.8-4.701 10.5-10.5 10.5v-3a7.5 7.5 0 0 0 5.007-13.084 1.5 1.5 0 0 1-.115-2.118Z" transform="translate(1.5 1.625)"></path>
                </g>
            </svg>
        </span>
    </div>
    <div class="initScreen">
        <div class="initScreen_internal">
            <h3>Info Exchange</h3>
            <input type="text" id="username" placeholder="Enter your username">
            <input type="text" id="targetusername" placeholder="Enter receipent username">
            <button id="startChatting">START CHATTING</button>
        </div>
    </div>

    <div class="chatScreen hidden">
        <div class="chatScreen_settings_container hidden">
            <button id="logoutBtn">LOG OUT</button>
            <button id="enableNotifications">Enable Notifications</button>
            <button id="togglePopSound">Sound <span id="toggglePopSound_status">Disabled</span></button>
        </div>
        <div class="chatScreen_statuscontianer">
            <p id="statusBar"></p>
            <div class="chatScreen_statuscontianer_usercontainer">
                <h4 id="targetUserNameTitle"></h4>
                <p id="typingStatus">-</p>
            </div>
            <button id="chatSettings">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32"
                    id="Wrench--Streamline-Emojitwo-Black" height="25" width="25">
                    <desc>
                        Wrench Streamline Emoji: https://streamlinehq.com
                    </desc>
                    <g>
                        <path fill="#000000"
                            d="M29.2285 20.6785a6.042 6.042 0 0 0 -5.706 -1.6L12.9205 8.479A6.045 6.045 0 0 0 11.321 2.77c-1.548 -1.548 -3.7255 -2.079 -5.7065 -1.5995l4.129 4.13 -0.939 3.5035 -3.5045 0.9395 -4.129 -4.13a6.0415 6.0415 0 0 0 1.6005 5.7075 6.042 6.042 0 0 0 5.706 1.6l10.602 10.6a6.045 6.045 0 0 0 1.5995 5.709c1.548 1.548 3.7255 2.079 5.7065 1.5995l-4.1295 -4.1305 0.939 -3.5035 3.505 -0.9395 4.128 4.13a6.037 6.037 0 0 0 -1.5995 -5.7075Z"
                            stroke-width="0.5"></path>
                    </g>
                </svg>
            </button>
        </div>
        <div class="chatScreen_conversationContainer">
        </div>
        <div class="chatScreen_inputcontainer_external">
            <div class="chatScreen_inputcontainer">
                <input type="text" id="message" placeholder="Enter your message">
                <button id="sendMessage">Send</button>
            </div>
        </div>
    </div>
    <script src="./client.js"></script>
</body>

</html>
