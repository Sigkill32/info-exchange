<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Exchange</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div class="loadingOverlay hidden">Loading...</div>
    <div class="initScreen">
        <input type="text" id="username" placeholder="Enter your username">
        <input type="text" id="targetusername" placeholder="Enter receipent username">
        <button id="startChatting">START CHATTING</button>
    </div>

    <div class="chatScreen hidden">
        <div class="chatScreen_settings_container hidden">
            <button id="logoutBtn">LOG OUT</button>
            <button id="enableNotifications">Enable Notifications</button>
        </div>
        <div class="chatScreen_statuscontianer">
            <p id="statusBar"></p>
            <div class="chatScreen_statuscontianer_usercontainer">
                <h4 id="targetUserNameTitle"></h4>
                <p id="typingStatus">-</p>
            </div>
            <button id="chatSettings"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32"
                    id="Wrench--Streamline-Emojitwo-Black" height="25" width="25">
                    <desc>
                        Wrench Streamline Emoji: https://streamlinehq.com
                    </desc>
                    <g>
                        <path fill="#000000"
                            d="M29.2285 20.6785a6.042 6.042 0 0 0 -5.706 -1.6L12.9205 8.479A6.045 6.045 0 0 0 11.321 2.77c-1.548 -1.548 -3.7255 -2.079 -5.7065 -1.5995l4.129 4.13 -0.939 3.5035 -3.5045 0.9395 -4.129 -4.13a6.0415 6.0415 0 0 0 1.6005 5.7075 6.042 6.042 0 0 0 5.706 1.6l10.602 10.6a6.045 6.045 0 0 0 1.5995 5.709c1.548 1.548 3.7255 2.079 5.7065 1.5995l-4.1295 -4.1305 0.939 -3.5035 3.505 -0.9395 4.128 4.13a6.037 6.037 0 0 0 -1.5995 -5.7075Z"
                            stroke-width="0.5"></path>
                    </g>
                </svg></button>
        </div>
        <div class="chatScreen_conversationContainer">
        </div>
        <div class="chatScreen_inputcontainer">
            <input type="text" id="message" placeholder="Enter your message">
            <button id="sendMessage">Send</button>
        </div>
    </div>
    <script src="./client.js"></script>
</body>

</html>
